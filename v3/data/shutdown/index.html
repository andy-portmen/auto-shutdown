<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shutdown in Progress!</title>
  <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
  <div id="info"></div>
  <div id="timer">
    <span id="number">--</span>
  </div>
  <div id="toolbar">
    <span>From</span>
    <span id="info-1">windows -> shutdown</span>
    <input type="button" data-cmd="execute" value="Execute">
    <span>Command</span>
    <span id="info-2">shutdown /s /f /t 0</span>
    <input type="button" data-cmd="cancel" value="Abort">
  </div>
  <script src="termlib_parser.js"></script>
  <script src="../../prefs.js"></script>
  <script src="index.js"></script>
</body>
</html>
